<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Carregando Delta GIS...</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        /* Área Superior (Onde entra a sua imagem personalizada) */
        .area-arte {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #0b0f19;
            overflow: hidden;
        }

        .area-arte img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta a imagem para ocupar perfeitamente o espaço */
        }

        /* Barra Inferior (Rodapé com a linha de carregamento) */
        .barra-inferior {
            height: 45px;
            background-color: #07090f;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-texto {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* A linha de carregamento na barra inferior */
        .linha-carregamento {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #38bdf8);
            box-shadow: 0 0 10px #38bdf8;
            animation: carregar 4.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes carregar {
            0% { width: 0%; }
            60% { width: 85%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Área Superior: Exibe a sua imagem personalizada -->
    <div class="area-arte">
        <img src="banner-splash.png" alt="Delta GIS Splash">
    </div>

    <!-- Barra Inferior com a linha de carregamento -->
     <div class="barra-inferior">
        <span class="status-texto">Inicializando...</span>
        <div class="linha-carregamento"></div>
    </div>

</body>
</html>
